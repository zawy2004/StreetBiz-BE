name: Deploy API to Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Tên Web App đã tạo trên Azure (phần trước .azurewebsites.net).
  AZURE_WEBAPP_NAME: streetbiz-api-CHANGE-ME
  # ghcr.io yêu cầu tên image viết thường.
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/streetbiz-api
  DOTNET_VERSION: 8.0.x

# Không cho hai lần deploy chạy chồng lên nhau.
concurrency:
  group: deploy-azure
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Test
        run: dotnet test StreetBiz.Backend.sln -c Release

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Tag theo commit SHA để Azure luôn kéo đúng bản vừa build, không dính cache "latest".
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ env.IMAGE_NAME }}:${{ github.sha }}
