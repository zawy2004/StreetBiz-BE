name: CI

# Checks every pull request before it can be merged. Nothing here deploys or pushes an image:
# deploy-vps.yml stays the only workflow that touches the server, and only on a push to main.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: 8.0.x
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Build and test (Release)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore StreetBiz.Backend.sln

      # Release, like the Docker publish: a package that only fails Release builds is caught here.
      - name: Build
        run: dotnet build StreetBiz.Backend.sln -c Release --no-restore

      - name: Test
        run: dotnet test StreetBiz.Backend.sln -c Release --no-build --logger "trx;LogFilePrefix=results" --results-directory TestResults

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          retention-days: 7

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Same Dockerfile as the deploy, built but never pushed.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: streetbiz-api:ci
          cache-from: type=gha
