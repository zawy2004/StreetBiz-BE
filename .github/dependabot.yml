# Monthly update PRs into develop, at most two per run (one minor/patch bundle, one major bundle). They go through CI like any other PR; nothing merges on its own.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 2
    commit-message:
      prefix: build
    labels: [dependencies]
    groups:
      # One PR for routine patch/minor bumps instead of one per package.
      minor-and-patch:
        update-types: [minor, patch]
      # Majors that are not ignored below arrive together in a second PR; close it if CI is red.
      major:
        update-types: [major]
    ignore:
      # The app targets .NET 8 (LTS); framework packages move with the runtime, not on their own.
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: [version-update:semver-major]
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        update-types: [version-update:semver-major]
      - dependency-name: "Microsoft.Extensions.*"
        update-types: [version-update:semver-major]
      # 3.2.0+ and 4.x fail every Release build without a paid Six Labors licence key
      # (see StreetBiz.Infrastructure.csproj).
      - dependency-name: "SixLabors.ImageSharp"
        versions: [">= 3.2.0"]
      # 8.x needs a paid licence for commercial use and rewrites the assertion API.
      - dependency-name: "FluentAssertions"
        versions: [">= 8.0.0"]
      # Majors of these Lucky Penny libraries change the licence terms and the API; take
      # security fixes through the minor-and-patch group on the current major instead.
      - dependency-name: "AutoMapper"
        update-types: [version-update:semver-major]
      - dependency-name: "MediatR"
        update-types: [version-update:semver-major]
      # 10.x pulls the .NET 10 Microsoft.Extensions packages into a .NET 8 app.
      - dependency-name: "Serilog.AspNetCore"
        update-types: [version-update:semver-major]
      # 10.x+ moves to Microsoft.OpenApi 2.x and breaks the Swagger setup in Program.cs.
      - dependency-name: "Swashbuckle.AspNetCore"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    commit-message:
      prefix: ci
    labels: [dependencies]
    groups:
      actions:
        patterns: ["*"]
